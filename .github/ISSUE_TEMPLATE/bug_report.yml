name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /scan
        2. Upload a two-column PDF
        3. …
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference
      description: The "Reference" shown with an error message, or the X-Request-Id of a failed request, if you have one.
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
  - type: markdown
    attributes:
      value: |
        Please don't attach real resumes or personal details. A description of the layout (columns, tables, file type) is usually enough. Security problems go through SECURITY.md, not issues.
